
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>윤태섭의 목표 페이지</title>

  <!-- =========================
       날짜 설정: 여기만 수정하세요!
       ========================= -->
  <script>
    const targetDate = "2027-11-18";
    const targetLabel = "수능까지";
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 30px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background:
        radial-gradient(circle at 8% 8%, rgba(255, 205, 220, 0.38), transparent 25%),
        radial-gradient(circle at 92% 18%, rgba(255, 232, 190, 0.42), transparent 27%),
        radial-gradient(circle at 88% 78%, rgba(210, 198, 255, 0.30), transparent 28%),
        radial-gradient(circle at 12% 82%, rgba(190, 240, 220, 0.34), transparent 26%),
        #fffaff;
      font-family: Arial, "Malgun Gothic",
                   "Apple SD Gothic Neo", sans-serif;
      color: #263747;
      overflow-x: hidden;
    }

    /* ===== D-day ===== */
    .dday {
      width: 100%;
      max-width: 360px;
      padding: 24px 16px;
      margin-bottom: 20px;
      border-radius: 24px;
      background: linear-gradient(115deg, #ffc7d8 0%, #ffe0b8 25%, #fff2b8 45%, #c9f2d7 65%, #c9eaff 82%, #dfd3ff 100%);
      color: #594b68;
      text-align: center;
      box-shadow: 0 10px 24px rgba(170, 140, 190, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.65);
      position: relative;
      overflow: hidden;
    }

    .dday::after {
      content: "";
      position: absolute;
      width: 115px;
      height: 115px;
      right: -38px;
      top: -45px;
      border: 1px solid rgba(255, 255, 255, 0.32);
      border-radius: 50%;
      box-shadow: 0 0 0 14px rgba(255, 255, 255, 0.07);
      pointer-events: none;
    }

    .dday-number {
      margin: 0 0 8px;
      font-size: clamp(48px, 12vw, 68px);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -2px;
    }

    .dday-label {
      margin: 0;
      font-size: 15px;
    }

    /* ===== 자기소개 카드 ===== */
    .card {
      width: 100%;
      max-width: 360px;
      padding: 32px 24px;
      margin-bottom: 30px;
      background: white;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 8px 26px rgba(154, 124, 173, 0.10);
      border: 1px solid rgba(232, 211, 241, 0.72);
      transition: transform 0.22s ease, box-shadow 0.22s ease;
    }

    .card:hover,
    .mandalart:hover {
      box-shadow: 0 12px 30px rgba(154, 124, 173, 0.15);
    }

    .emoji {
      width: 100px;
      height: 100px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #ffe0eb, #e7ddff 55%, #d9f5ee);
      border: 1px solid #f0e1f5;
      border-radius: 28px;
      box-shadow: 0 6px 16px rgba(180, 145, 196, 0.12);
      font-size: 64px;
    }

    .card h1 {
      margin: 0 0 12px;
      font-size: 28px;
      word-break: keep-all;
    }

    .intro {
      margin: 0 0 24px;
      color: #716b83;
      font-size: 15px;
      line-height: 1.7;
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    .tags {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 28px;
    }

    .tag {
      padding: 9px 14px;
      border-radius: 999px;
      background: #f4eaff;
      border: 1px solid #e9dcf7;
      color: #755b91;
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
      transition: transform 0.18s ease, background 0.18s ease;
    }

    .tag:hover {
      transform: translateY(-2px);
      background: #eadcff;
    }

    .github-button {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      background: linear-gradient(110deg, #f4b9ce, #c9c2f6, #b9e8e4);
      color: #514663;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 5px 14px rgba(178, 145, 190, 0.20);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .github-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(178, 145, 190, 0.25);
    }

    /* ===== 만다라트 ===== */
    .mandalart {
      width: 100%;
      max-width: 600px;
      margin: 0 auto 30px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(232, 211, 241, 0.72);
      border-radius: 24px;
      box-shadow: 0 8px 26px rgba(154, 124, 173, 0.10);
      transition: box-shadow 0.22s ease;
    }

    .mandalart-title {
      margin: 0 0 8px;
      text-align: center;
      font-size: 28px;
      letter-spacing: -0.7px;
    }

    .mandalart-title::after {
      content: "";
      display: block;
      width: 36px;
      height: 3px;
      margin: 9px auto 0;
      border-radius: 99px;
      background: linear-gradient(90deg, #f7bfd2, #ffe1b9, #fff0b5, #c8ebd2, #c7e8fa, #d8c9f5);
    }

    .mandalart-guide {
      margin: 0 0 20px;
      text-align: center;
      color: #716b83;
      font-size: 14px;
    }

    .mandalart-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      width: 100%;
    }

    .goal-cell {
      aspect-ratio: 1 / 1;
      min-width: 0;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-wrap: anywhere;
      word-break: keep-all;
      overflow-y: auto;

      background: #fff0f4;
      border: 2px solid #f6cfdd;
      border-radius: 12px;
      text-align: center;
      font-size: clamp(11px, 3.2vw, 16px);
      font-weight: 600;
      line-height: 1.5;
      cursor: text;
      outline: none;
      transition: border-color 0.18s ease, background 0.18s ease, transform 0.18s ease;
    }

    .goal-cell:nth-child(2) { background: #fff4e6; border-color: #f5dfbd; }
    .goal-cell:nth-child(3) { background: #fff9dc; border-color: #f0e6ad; }
    .goal-cell:nth-child(4) { background: #eaf8ed; border-color: #ccebd3; }
    .goal-cell:nth-child(5) { background: #e9f5ff; border-color: #c9e3fa; }
    .goal-cell:nth-child(6) { background: #f0eaff; border-color: #d9cef8; }
    .goal-cell:nth-child(7) { background: #fceaff; border-color: #efcfee; }
    .goal-cell:nth-child(8) { background: #ffedf0; border-color: #f4d0d9; }
    .goal-cell:nth-child(9) { background: #e8f8f3; border-color: #c7eadd; }

    .goal-cell:hover {
      border-color: #c5b2e7;
      transform: translateY(-1px);
    }

    .goal-cell:focus {
      border-color: #b9a4dc;
      background: #fffaff;
      box-shadow: 0 0 0 2px rgba(185, 164, 220, 0.15);
    }

    .goal-cell.main-goal {
      background: linear-gradient(145deg, #d8ccff, #c8e8ff);
      color: #514663;
      border-color: #cbbdf5;
      font-size: clamp(13px, 3.6vw, 19px);
      font-weight: 800;
    }

    .goal-cell.main-goal:focus {
      background: linear-gradient(145deg, #cbbdf5, #b9def8);
    }

    .mandalart-status {
      margin: 14px 0 0;
      text-align: center;
      font-size: 12px;
      color: #716b83;
    }

    @media (max-width: 360px) {
      body {
        padding: 20px 10px;
      }

      .mandalart {
        padding: 10px;
      }

      .mandalart-grid {
        gap: 4px;
      }

      .goal-cell {
        padding: 4px;
        border-radius: 8px;
        font-size: 11px;
      }
    }

    /* ===== 입장 폭죽 효과 ===== */
    #confettiCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
    }

    @media (prefers-reduced-motion: reduce) {
      #confettiCanvas {
        display: none;
      }
    }

  </style>
</head>

<body>
  <canvas id="confettiCanvas" aria-hidden="true"></canvas>

  <!-- ===== 1. 수능 D-day ===== -->
  <section class="dday">
    <p class="dday-number" id="ddayNumber">D-day</p>
    <p class="dday-label" id="ddayLabel"></p>
  </section>

  <!-- ===== 2. 자기소개 카드 ===== -->
  <main class="card">
    <div class="emoji">😊</div>

    <h1>윤태섭</h1>

    <p class="intro">
      로봇, 코딩을 좋아하는 고등학교 2학년입니다
    </p>

    <div class="tags">
      <span class="tag">🎵 음악</span>
      <span class="tag">🤖 로봇</span>
      <span class="tag">🏃 운동</span>
    </div>

    <a
      class="github-button"
      href="https://github.com/"
      target="_blank"
      rel="noopener noreferrer"
    >
      내 깃허브 ↗
    </a>
  </main>

  <!-- ===== 3. 만다라트 목표판 ===== -->
  <section class="mandalart">
    <h2 class="mandalart-title">나의 목표</h2>
    <p class="mandalart-guide">
      칸을 눌러서 고칠 수 있어요
    </p>

    <div class="mandalart-grid" id="mandalartGrid">
      <div class="goal-cell" contenteditable="true">매일 30분 영어 듣기</div>
      <div class="goal-cell" contenteditable="true">수학 오답노트</div>
      <div class="goal-cell" contenteditable="true">주 3회 운동</div>

      <div class="goal-cell" contenteditable="true">독서 월 2권</div>
      <div class="goal-cell main-goal" contenteditable="true">로봇공학과 진학</div>
      <div class="goal-cell" contenteditable="true">동아리 발표</div>

      <div class="goal-cell" contenteditable="true">7시간 수면</div>
      <div class="goal-cell" contenteditable="true">봉사활동 20시간</div>
      <div class="goal-cell" contenteditable="true">코딩 포트폴리오</div>
    </div>

    <p class="mandalart-status" id="mandalartStatus">
      수정한 내용은 자동으로 저장돼요.
    </p>
  </section>

  <script>
    // ===== D-day 자동 계산 =====
    function updateDday() {
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const target = new Date(targetDate + "T00:00:00");
      const remaining = Math.round(
        (target.getTime() - today.getTime()) /
        (1000 * 60 * 60 * 24)
      );

      let result;

      if (remaining > 0) {
        result = `D-${remaining}`;
      } else if (remaining === 0) {
        result = "D-Day";
      } else {
        result = `D+${Math.abs(remaining)}`;
      }

      document.getElementById("ddayNumber").textContent = result;
      document.getElementById("ddayLabel").textContent = targetLabel;
    }

    updateDday();

    // ===== 만다라트 자동 저장 =====
    (() => {
      const grid = document.getElementById("mandalartGrid");
      const status = document.getElementById("mandalartStatus");
      const storageKey = "myMandalartGoals";
      const cells = grid.querySelectorAll(".goal-cell");

      // 저장된 목표 불러오기
      try {
        const saved = localStorage.getItem(storageKey);

        if (saved) {
          const goals = JSON.parse(saved);

          cells.forEach((cell, index) => {
            if (typeof goals[index] === "string") {
              cell.textContent = goals[index];
            }
          });
        }
      } catch (error) {
        status.textContent = "저장된 내용을 불러오지 못했어요.";
      }

      // 글자를 수정하면 자동 저장
      cells.forEach((cell) => {
        cell.addEventListener("input", () => {
          try {
            const goals = Array.from(cells).map(
              (item) => item.textContent
            );

            localStorage.setItem(
              storageKey,
              JSON.stringify(goals)
            );

            status.textContent = "자동 저장 완료 ✓";
          } catch (error) {
            status.textContent = "저장에 실패했어요.";
          }
        });

        // Enter를 누르면 편집 종료
        cell.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            event.preventDefault();
            cell.blur();
          }
        });
      });
    })();
  </script>

  <script>

    // ===== 페이지에 들어오면 하늘색 폭죽이 터지는 효과 =====
    (() => {
      const canvas = document.getElementById("confettiCanvas");
      if (!canvas || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

      const ctx = canvas.getContext("2d");
      if (!ctx) return;

      let width = 0;
      let height = 0;
      let particles = [];
      let animationId = null;

      const colors = ["#ffc7d8", "#ffe0b8", "#fff2b8", "#c9f2d7", "#c9eaff", "#dfd3ff", "#ffffff"];

      function resizeCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function burst(x, y, amount = 90) {
        for (let i = 0; i < amount; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 2 + Math.random() * 6;
          particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            gravity: 0.055 + Math.random() * 0.055,
            size: 3 + Math.random() * 4,
            color: colors[Math.floor(Math.random() * colors.length)],
            rotation: Math.random() * Math.PI * 2,
            spin: (Math.random() - 0.5) * 0.22,
            life: 70 + Math.random() * 45,
            maxLife: 115,
            shape: Math.random() > 0.5 ? "rect" : "circle"
          });
        }
      }

      function animate() {
        ctx.clearRect(0, 0, width, height);

        particles = particles.filter(p => p.life > 0);
        for (const p of particles) {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += p.gravity;
          p.vx *= 0.99;
          p.rotation += p.spin;
          p.life--;

          ctx.save();
          ctx.globalAlpha = Math.min(1, p.life / 24);
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rotation);
          ctx.fillStyle = p.color;

          if (p.shape === "rect") {
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 1.7);
          } else {
            ctx.beginPath();
            ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }

        if (particles.length > 0) {
          animationId = requestAnimationFrame(animate);
        } else {
          ctx.clearRect(0, 0, width, height);
          animationId = null;
        }
      }

      function launchConfetti() {
        resizeCanvas();
        // 세 군데에서 연속으로 터지는 느낌
        burst(width * 0.22, height * 0.28, 48);
        burst(width * 0.78, height * 0.25, 48);
        burst(width * 0.50, height * 0.18, 58);

        if (animationId === null) animate();
      }

      window.addEventListener("resize", resizeCanvas);
      window.addEventListener("pageshow", launchConfetti);
      resizeCanvas();
      launchConfetti();
    })();

  </script>

</body>
</html>
